openapi: 3.0.3
info:
  title: Report Service API
  description: Generación de reportes generales y últimos movimientos.
  version: 1.0.0

tags:
  - name: Report
    description: Operaciones de generación y consulta de reportes

security:
  - BearerAuth: []
paths:
  /api/v1/reports/products:
    post:
      tags:
        - Report
      summary: Generar reporte general por producto en rango de fechas
      description: |
        **Validaciones obligatorias (implementadas en backend):**
        - fromDate <= toDate. Si no se cumple, se rechaza con 422 Unprocessable Entity.
        - Rango máximo de 90 días. Si se excede, se rechaza con 422 Unprocessable Entity.
        - Se deben incluir pruebas unitarias para fechas invertidas, rangos > 90 días y casos límite (mismo día, rango exacto de 90 días).
        - Idempotente mediante X-Transaction-ID.
      operationId: generateProductReport
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
        - $ref: '#/components/parameters/TransactionIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductReportRequest' } } }
      responses:
        '202':
          description: Reporte aceptado
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationAcceptedResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/cards/last-movements:
    post:
      tags:
        - Report
      summary: Reporte de últimos 10 movimientos de tarjeta (consolidado)
      description: |
        Idempotente mediante X-Transaction-ID.
        Genera un reporte consolidado de todas las tarjetas del cliente.
        Si se especifica cardType, filtra por ese tipo. Si no, incluye crédito y débito.
      operationId: generateCardMovementsReport
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
        - $ref: '#/components/parameters/TransactionIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CardMovementsReportRequest' } } }
      responses:
        '202':
          description: Reporte aceptado
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationAcceptedResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/reports/{reportId}:
    get:
      tags:
        - Report
      summary: Consultar estado/resultado del reporte
      operationId: findReportById
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
      responses:
        '200':
          description: Resultado del reporte
          content: { application/json: { schema: { $ref: '#/components/schemas/ReportResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CorrelationIdHeader: { name: X-Correlation-ID, in: header, required: true, schema: { type: string } }
    ChannelIdHeader: { name: X-Channel-ID, in: header, required: true, schema: { type: string } }
    TransactionIdHeader: { name: X-Transaction-ID, in: header, required: true, schema: { type: string, format: uuid } }
    ReportIdPath: { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ProductType: { type: string, enum: [SAVINGS, CHECKING, FIXED_TERM, CREDIT, CARD] }
    ProductReportRequest:
      type: object
      required: [productType, fromDate, toDate, format]
      properties:
        productType: { $ref: '#/components/schemas/ProductType' }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        format: { type: string, enum: [CSV, PDF], default: CSV }
    CardMovementsReportRequest:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, format: uuid }
        cardType: { type: string, enum: [CREDIT, DEBIT, BOTH], default: BOTH }
    ReportResponse:
      type: object
      properties:
        reportId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] }
        generatedAt: { type: string, format: date-time }
        downloadUrl: { type: string }
        errorMessage: { type: string }
    OperationAcceptedResponse:
      type: object
      properties:
        operationId: { type: string, format: uuid }
        reportId: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, PENDING] }
    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        correlationId: { type: string }
        details: { type: array, items: { type: string } }
  responses:
    BadRequest:
      description: Solicitud inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: No autenticado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: No autorizado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: No encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnprocessableEntity:
      description: Entidad no procesable (fechas inválidas o rango > 90 días)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalServerError:
      description: Error interno
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }